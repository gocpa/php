name: Build and publish a Docker image

on:
  release:
    types: [published]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PHP ${{ matrix.php_version }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.4", "8.5"]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            docker_platform: linux/amd64
          - platform: arm64
            docker_platform: linux/arm64/v8
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.docker_platform }}
          push: ${{ github.event_name == 'release' }}
          tags: |
            gocpa/php:${{ matrix.php_version }}-fpm-${{ github.run_number }}-${{ matrix.platform }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: Merge manifest PHP ${{ matrix.php_version }}
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        php_version: ["8.4", "8.5"]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create -t gocpa/php:${{ matrix.php_version }}-fpm-${{ github.run_number }} \
            gocpa/php:${{ matrix.php_version }}-fpm-${{ github.run_number }}-amd64 \
            gocpa/php:${{ matrix.php_version }}-fpm-${{ github.run_number }}-arm64
